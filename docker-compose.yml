# Local development stack: PostgreSQL + Redis + Django API + Celery worker/beat.
#   cp backend/.env.example backend/.env
#   docker compose up --build
# API: http://localhost:8000  ·  Swagger: http://localhost:8000/api/docs/
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: whatinside
      POSTGRES_USER: whatinside
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-whatinside}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whatinside -d whatinside"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://whatinside:${POSTGRES_PASSWORD:-whatinside}@db:5432/whatinside
      CELERY_BROKER_URL: redis://redis:6379/0
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://whatinside:${POSTGRES_PASSWORD:-whatinside}@db:5432/whatinside
      CELERY_BROKER_URL: redis://redis:6379/0
    command: celery -A config worker -l info --concurrency 2
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  beat:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://whatinside:${POSTGRES_PASSWORD:-whatinside}@db:5432/whatinside
      CELERY_BROKER_URL: redis://redis:6379/0
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule
    depends_on:
      redis: { condition: service_healthy }

volumes:
  pgdata:
