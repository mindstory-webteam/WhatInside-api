          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailTokenObtainRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/v1/auth/logout/:
    post:
      operationId: v1_auth_logout_create
