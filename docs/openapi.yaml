  /api/v1/shopping-list/{id}/mark-unpurchased/:
    post:
      operationId: v1_shopping_list_mark_unpurchased_create
      description: 'Use in viewsets: provides ``self.household`` / ``self.membership``
        and household filtering.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShoppingListItem'
          description: ''
  /api/v1/shopping-list/clear-purchased/:
    post:
      operationId: v1_shopping_list_clear_purchased_create
      description: 'Use in viewsets: provides ``self.household`` / ``self.membership``
        and household filtering.'
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
components:
  schemas:
    AddToInventoryRequest:
      type: object
      description: Converting a purchase into inventory requires an explicit decision
        about the expiry date.
      properties:
        storage_location:
          allOf:
          - $ref: '#/components/schemas/StorageLocationEnum'
          default: refrigerator
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,3})?$
        expiry_date:
          type: string
          format: date
          nullable: true
        best_before_date:
          type: string
          format: date
          nullable: true
        expiry_unknown:
          type: boolean
          default: false
          description: Set true to save without a date; the batch is flagged.
        purchase_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
        category:
          $ref: '#/components/schemas/CategoryEnum'
    BarcodeRequestRequest:
      type: object
      properties:
        barcode:
          type: string
          minLength: 1
          maxLength: 14
      required:
      - barcode
    Batch:
      type: object
      description: Read representation. ``expiry_status`` is computed with the household's
        local date.
      properties:
        id:
          type: integer
          readOnly: true
        product:
          allOf:
          - $ref: '#/components/schemas/ProductSummary'
          readOnly: true
        storage_location:
          allOf:
          - $ref: '#/components/schemas/StorageLocationEnum'
          readOnly: true
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,3})?$
          readOnly: true
        initial_quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,3})?$
          readOnly: true
        unit:
          allOf:
          - $ref: '#/components/schemas/UnitEnum'
          readOnly: true
        purchase_date:
          type: string
          format: date
          readOnly: true
          nullable: true
        manufacturing_date:
          type: string
          format: date
          readOnly: true
          nullable: true
        expiry_date:
          type: string
          format: date
          readOnly: true
          nullable: true
          description: Expiry / use-by date (date-only, no timezone).
        best_before_date:
          type: string
          format: date
          readOnly: true
          nullable: true
        effective_expiry:
          type: string
          format: date
          readOnly: true
        expiry_confirmed:
          type: boolean
          readOnly: true
          description: True only after a person has reviewed/entered the date.
        batch_number:
          type: string
          readOnly: true
        purchase_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
          description: Total price paid for this batch.
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,4})?$
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/BatchStatusEnum'
          readOnly: true
        notes:
          type: string
          readOnly: true
        version:
          type: integer
          readOnly: true
          description: Optimistic concurrency token.
        expiry_status:
          type: string
          readOnly: true
        days_until_expiry:
          type: integer
          nullable: true
          readOnly: true
        needs_review:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - batch_number
      - best_before_date
      - created_at
      - days_until_expiry
      - effective_expiry
      - expiry_confirmed
      - expiry_date
      - expiry_status
      - id
      - initial_quantity
      - manufacturing_date
      - needs_review
      - notes
      - product
      - purchase_date
      - purchase_price
      - quantity
      - status
      - storage_location
      - unit
      - unit_price
      - updated_at
      - version
    BatchCreateRequest:
      type: object
      properties:
        product:
          type: integer
          description: Existing product id
        new_product:
          allOf:
          - $ref: '#/components/schemas/NewProductRequest'
          description: Create or reuse a product by barcode/name
        storage_location:
          allOf:
          - $ref: '#/components/schemas/StorageLocationEnum'
          default: refrigerator
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,3})?$
        unit:
          $ref: '#/components/schemas/UnitEnum'
        purchase_date:
          type: string
          format: date
          nullable: true
        manufacturing_date:
          type: string
          format: date
          nullable: true
        expiry_date:
          type: string
          format: date
          nullable: true
        best_before_date:
          type: string
          format: date
          nullable: true
        expiry_confirmed:
          type: boolean
          default: false
          description: Send true only after the user reviewed the date. Unconfirmed
            dates are flagged.
        batch_number:
          type: string
          default: ''
          maxLength: 64
        purchase_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
        notes:
          type: string
          default: ''
          maxLength: 500
      required:
      - quantity
    BatchStatusEnum:
      enum:
      - active
      - finished
      - discarded
      type: string
      description: |-
        * `active` - Active
        * `finished` - Finished
        * `discarded` - Discarded
    CategoryEnum:
      enum:
      - dairy
      - meat_seafood
      - produce
      - bakery
      - beverages
      - frozen
      - grains
      - snacks
      - condiments
      - household
      - personal_care
      - medicine
      - other
      type: string
      description: |-
        * `dairy` - Dairy
        * `meat_seafood` - Meat & Seafood
        * `produce` - Fruits & Vegetables
        * `bakery` - Bakery
        * `beverages` - Beverages
        * `frozen` - Frozen
        * `grains` - Grains & Pulses
        * `snacks` - Snacks
        * `condiments` - Sauces & Spices
        * `household` - Household Supplies
        * `personal_care` - Personal Care
        * `medicine` - Medicine
        * `other` - Other
    ChangePasswordRequest:
      type: object
      properties:
        current_password:
          type: string
          writeOnly: true
          minLength: 1
        new_password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - current_password
      - new_password
    ConfirmScanRequest:
      type: object
      description: Saves a reviewed scan. ``confirmed`` must be true — nothing is
        saved from an unreviewed scan.
      properties:
        product:
          type: integer
          description: Existing product id
        new_product:
          allOf:
          - $ref: '#/components/schemas/NewProductRequest'
          description: Create or reuse a product by barcode/name
        storage_location:
          allOf:
          - $ref: '#/components/schemas/StorageLocationEnum'
          default: refrigerator
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,3})?$
        unit:
          $ref: '#/components/schemas/UnitEnum'
        purchase_date:
          type: string
          format: date
          nullable: true
        manufacturing_date:
          type: string
          format: date
          nullable: true
        expiry_date:
          type: string
          format: date
          nullable: true
        best_before_date:
          type: string
          format: date
          nullable: true
        expiry_confirmed:
          type: boolean
        batch_number:
          type: string
          default: ''
          maxLength: 64
        purchase_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
        notes:
          type: string
          default: ''
          maxLength: 500
        confirmed:
          type: boolean
        source:
          allOf:
          - $ref: '#/components/schemas/SourceEnum'
          default: manual
      required:
      - confirmed
      - quantity
    DateFormatEnum:
      enum:
      - DD/MM/YYYY
      - MM/DD/YYYY
      - YYYY-MM-DD
      type: string
      description: |-
        * `DD/MM/YYYY` - DD/MM/YYYY
        * `MM/DD/YYYY` - MM/DD/YYYY
        * `YYYY-MM-DD` - YYYY-MM-DD
    DateOrderEnum:
      enum:
      - dmy
      - mdy
      type: string
      description: |-
        * `dmy` - dmy
        * `mdy` - mdy
    DaysBeforeExpiryEnum:
      enum:
      - 7
      - 3
      - 1
      - 0
      type: integer
      description: |-
        * `7` - 7
        * `3` - 3
        * `1` - 1
        * `0` - 0
    DeliveryMethodsEnum:
      enum:
      - local
      - push
      type: string
      description: |-
        * `local` - local
        * `push` - push
    DeviceToken:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        token:
          type: string
          maxLength: 255
          pattern: ^(ExponentPushToken|ExpoPushToken)\[[A-Za-z0-9_\-]+\]$
        platform:
          $ref: '#/components/schemas/PlatformEnum'
        device_name:
          type: string
          maxLength: 120
        is_active:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        last_seen_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - is_active
      - last_seen_at
      - platform
      - token
    DeviceTokenRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^(ExponentPushToken|ExpoPushToken)\[[A-Za-z0-9_\-]+\]$
        platform:
          $ref: '#/components/schemas/PlatformEnum'
        device_name:
          type: string
          maxLength: 120
      required:
      - platform
      - token
    DiscardRequest:
      type: object
      properties:
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,3})?$
          description: Omit to discard everything left.
        reason:
          allOf:
          - $ref: '#/components/schemas/ReasonEnum'
          default: other
        note:
          type: string
          default: ''
          maxLength: 500
        version:
          type: integer
    EmailTokenObtainRequest:
      type: object
      description: Login with email + password; returns access, refresh and the user
        profile.
      properties:
        email:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    EventTypeEnum:
      enum:
      - added
      - consumed
      - discarded
      - restocked
      - adjusted
      - finished
      - deleted
      type: string
      description: |-
        * `added` - Added
        * `consumed` - Consumed
        * `discarded` - Discarded
        * `restocked` - Restocked
        * `adjusted` - Adjusted
        * `finished` - Finished
        * `deleted` - Deleted
    Household:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 120
        owner:
          type: integer
          readOnly: true
        timezone:
          type: string
          maxLength: 64
        created_at:
          type: string
          format: date-time
          readOnly: true
        my_role:
          type: string
          nullable: true
          readOnly: true
        member_count:
          type: integer
          readOnly: true
      required:
      - created_at
      - id
      - member_count
      - my_role
      - name
      - owner
    HouseholdRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        timezone:
          type: string
          minLength: 1
          maxLength: 64
      required:
      - name
    InventoryEvent:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        batch:
          type: integer
          readOnly: true
          nullable: true
        product:
          type: integer
          readOnly: true
          nullable: true
        product_name:
          type: string
          readOnly: true
        event_type:
          allOf:
          - $ref: '#/components/schemas/EventTypeEnum'
          readOnly: true
        quantity_change:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,3})?$
          readOnly: true
        unit:
          allOf:
          - $ref: '#/components/schemas/UnitEnum'
          readOnly: true
        reason:
          type: string
          readOnly: true
        note:
          type: string
          readOnly: true
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
          description: Estimated value of the quantity changed (from the batch's purchase
            price).
        before_expiry:
          type: boolean
          readOnly: true
          nullable: true
          description: Whether the change happened on/before the expiry date.
        actor:
          type: integer
          readOnly: true
          nullable: true
        actor_name:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - actor
      - actor_name
      - batch
      - before_expiry
      - created_at
      - event_type
      - id
      - note
      - price
      - product
      - product_name
      - quantity_change
      - reason
      - unit
    Invitation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        role:
          $ref: '#/components/schemas/InvitationRoleEnum'
        code:
          type: string
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        accepted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        revoked:
          type: boolean
          readOnly: true
      required:
      - accepted_at
      - code
      - created_at
      - expires_at
      - id
      - revoked
    InvitationRequest:
      type: object
      properties:
        email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        role:
          $ref: '#/components/schemas/InvitationRoleEnum'
    InvitationRoleEnum:
      enum:
      - admin
      - member
      type: string
      description: |-
        * `admin` - Administrator
        * `member` - Member
    JoinRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 32
      required:
      - code
    LogoutRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    Member:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        role:
          $ref: '#/components/schemas/MemberRoleEnum'
        status:
          allOf:
          - $ref: '#/components/schemas/MemberStatusEnum'
          readOnly: true
        joined_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - email
      - id
      - joined_at
      - name
      - status
      - user
    MemberRoleEnum:
      enum:
      - owner
      - admin
      - member
      type: string
      description: |-
        * `owner` - Owner
        * `admin` - Administrator
        * `member` - Member
    MemberRoleRoleEnum:
      enum:
      - admin
      - member
      type: string
      description: |-
        * `admin` - admin
        * `member` - member
    MemberStatusEnum:
      enum:
      - active
      - removed
      - left
      type: string
      description: |-
        * `active` - Active
        * `removed` - Removed
        * `left` - Left
    NewProductRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        brand:
          type: string
          default: ''
          maxLength: 120
        barcode:
          oneOf:
          - type: string
            default: ''
            pattern: ^\d{6,14}$
          - type: string
            maxLength: 0
        category:
          allOf:
          - $ref: '#/components/schemas/CategoryEnum'
          default: other
        default_unit:
          allOf:
          - $ref: '#/components/schemas/UnitEnum'
          default: pcs
        image_url:
          oneOf:
          - type: string
            format: uri
            default: ''
          - type: string
            maxLength: 0
      required:
      - name
    NotificationPreference:
      type: object
      properties:
        enabled:
          type: boolean
        days_before_expiry:
          type: array
          items:
            $ref: '#/components/schemas/DaysBeforeExpiryEnum'
          description: Any of 7, 3, 1, 0 (0 = on the expiry date)
        delivery_methods:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryMethodsEnum'
        reminder_hour:
          type: integer
          maximum: 23
          minimum: 0
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - days_before_expiry
      - delivery_methods
      - reminder_hour
      - updated_at
    NotificationRecord:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        household:
          type: integer
          readOnly: true
        batch:
          type: integer
          readOnly: true
          nullable: true
        notification_type:
          type: string
          readOnly: true
        days_before:
          type: integer
          readOnly: true
        expiry_date:
          type: string
          format: date
          readOnly: true
        scheduled_for:
          type: string
          format: date-time
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/NotificationRecordStatusEnum'
          readOnly: true
        title:
          type: string
          readOnly: true
        body:
          type: string
          readOnly: true
        sent_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        read_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - batch
      - body
      - created_at
      - days_before
      - expiry_date
      - household
      - id
      - notification_type
      - read_at
      - scheduled_for
      - sent_at
      - status
      - title
    NotificationRecordStatusEnum:
      enum:
      - pending
      - sent
      - local_only
      - failed
      - cancelled
      - skipped
      type: string
      description: |-
        * `pending` - Pending
        * `sent` - Sent (push)
        * `local_only` - Device reminder only
        * `failed` - Failed
        * `cancelled` - Cancelled
        * `skipped` - Skipped
    OcrRequestRequest:
      type: object
      properties:
        image:
          type: string
          format: binary
          description: JPEG/PNG/WebP label photo (server-side OCR)
        raw_text:
          type: string
          minLength: 1
          description: Text recognised on-device (ML Kit). Re-normalised on the server.
          maxLength: 20000
