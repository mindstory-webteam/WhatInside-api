openapi: 3.0.3
info:
  title: WhatInside API
  version: 1.0.0
  description: Household inventory, expiry tracking, scanning and reminders. Know
    what's inside. Never waste again.
paths:
  /api/v1/analytics/overview/:
    get:
      operationId: v1_analytics_overview_retrieve
      description: 'Use in viewsets: provides ``self.household`` / ``self.membership``
        and household filtering.'
      parameters:
      - in: query
        name: months
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/analytics/waste/:
