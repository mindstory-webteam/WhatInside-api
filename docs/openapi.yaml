      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedShoppingListItemRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedShoppingListItemRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedShoppingListItemRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShoppingListItem'
          description: ''
    delete:
      operationId: v1_shopping_list_destroy
      description: 'Use in viewsets: provides ``self.household`` / ``self.membership``
        and household filtering.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/shopping-list/{id}/add-to-inventory/:
    post:
      operationId: v1_shopping_list_add_to_inventory_create
      description: 'Use in viewsets: provides ``self.household`` / ``self.membership``
        and household filtering.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddToInventoryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddToInventoryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddToInventoryRequest'
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
          description: ''
  /api/v1/shopping-list/{id}/mark-purchased/:
    post:
      operationId: v1_shopping_list_mark_purchased_create
      description: 'Idempotent: marking an already-purchased item again is a no-op.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShoppingListItem'
