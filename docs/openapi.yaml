  /api/v1/inventory/:
    get:
      operationId: v1_inventory_list
      description: Inventory batches. Lists default to ``status=active`` unless ``status``
        is given.
      parameters:
      - in: query
        name: category
        schema:
          type: array
          items:
            type: string
            enum:
            - bakery
            - beverages
            - condiments
            - dairy
            - frozen
            - grains
            - household
            - meat_seafood
            - medicine
            - other
            - personal_care
            - produce
            - snacks
        description: |-
          * `dairy` - Dairy
          * `meat_seafood` - Meat & Seafood
          * `produce` - Fruits & Vegetables
          * `bakery` - Bakery
          * `beverages` - Beverages
          * `frozen` - Frozen
          * `grains` - Grains & Pulses
          * `snacks` - Snacks
          * `condiments` - Sauces & Spices
          * `household` - Household Supplies
          * `personal_care` - Personal Care
          * `medicine` - Medicine
          * `other` - Other
        explode: true
        style: form
      - in: query
        name: expiry_from
        schema:
          type: string
          format: date
      - in: query
        name: expiry_status
        schema:
          type: string
          enum:
          - expired
          - expiring_soon
          - fresh
          - unknown
        description: |-
          * `fresh` - Fresh
          * `expiring_soon` - Expiring soon
          * `expired` - Expired
          * `unknown` - Date needs review
      - in: query
        name: expiry_to
        schema:
          type: string
          format: date
      - in: query
        name: needs_review
        schema:
          type: boolean
      - in: query
        name: ordering
        schema:
          type: string
        description: product_name, -product_name, effective_expiry, -created_at
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: product
        schema:
          type: number
      - in: query
        name: search
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: array
          items:
            type: string
            enum:
            - active
            - discarded
            - finished
        description: |-
          * `active` - Active
          * `finished` - Finished
          * `discarded` - Discarded
        explode: true
        style: form
      - in: query
        name: storage_location
        schema:
          type: array
          items:
            type: string
            enum:
            - freezer
            - other
            - pantry
            - refrigerator
        description: |-
          * `refrigerator` - Refrigerator
          * `freezer` - Freezer
          * `pantry` - Pantry
          * `other` - Other
        explode: true
        style: form
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBatchList'
          description: ''
    post:
      operationId: v1_inventory_create
